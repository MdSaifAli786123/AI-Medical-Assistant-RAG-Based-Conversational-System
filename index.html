<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to AI...</title>
    
    <meta http-equiv="refresh" content="3; url=https://app.vectorshift.ai/chatbots/deployed/695184f6a76af4b718b48da7">

    <style>
        /* Reset and Base Styles */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b); /* Modern Dark Blue/Grey Gradient */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container for content */
        .container {
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        /* The Animated Spinner */
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3b82f6; /* Bright Blue Accent */
            border-radius: 50%;
            margin: 0 auto 20px auto;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); /* Glowing effect */
        }

        /* Text Styling */
        h2 {
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-size: 24px;
        }

        p {
            color: #94a3b8; /* Muted text color */
            font-size: 14px;
        }

        /* Animations */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h2>Initializing Chatbot</h2>
        <p>Redirecting you to VectorShift...</p>
    </div>

    <script>
        // Set a 2000ms (2 second) delay so the user sees the animation
        // This makes the experience feel smoother and less "glitchy"
        setTimeout(function() {
            window.location.href = "https://app.vectorshift.ai/chatbots/deployed/695184f6a76af4b718b48da7";
        }, 2000);
    </script>

</body>
</html>
